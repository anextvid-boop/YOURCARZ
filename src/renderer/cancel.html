<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - YOURCARZ Secure Escrow</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #020617;
      margin: 0;
      font-family: 'Outfit', sans-serif;
    }
    .cancel-card {
      background: #0F172A;
      border: 1px solid #EF4444;
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(239, 68, 68, 0.15);
    }
    h1 {
      color: #EF4444;
      font-weight: 900;
      font-size: 32px;
      margin-bottom: 16px;
    }
    p {
      color: #94A3B8;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #F8FAFC;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="cancel-card">
    <div style="background: rgba(239, 68, 68, 0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
      <i data-lucide="x-circle" style="width: 48px; height: 48px; color: #EF4444;"></i>
    </div>
    <h1>Reservation Cancelled</h1>
    <p>Your holding deposit transaction was cancelled. No funds were captured. The vehicle remains available for other buyers.</p>
    
    <a href="index.html" class="btn btn-secondary" style="display: block; text-decoration: none; padding: 14px; font-weight: 700; border-radius: 12px;">Return to Showroom</a>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
